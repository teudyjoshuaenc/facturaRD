# Postgres efímero para los e2e de apps/api.
# Puertos alternos (5433) para no chocar con el docker-compose de desarrollo
# (que usa 5432). La base facturard_test se crea/limpia en cada corrida.
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: facturard-postgres-test
    environment:
      POSTGRES_USER: facturard
      POSTGRES_PASSWORD: facturard_dev
      POSTGRES_DB: facturard_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturard"]
      interval: 2s
      timeout: 3s
      retries: 15
