# Panel DMAIA (adminfacturard.dmaia.io). Lo sirve la MISMA app web de FacturaRD:
# el middleware de Next reescribe todo este dominio a /admin, y en el dominio de
# los clientes /admin da 404. El panel llama a la API en el dominio principal
# (NEXT_PUBLIC_API_URL), así que aquí sólo va el frontend.
#
# Instalación a mano en el VPS (setup.sh no lo hace todavía):
#   1. DNS: registro A  adminfacturard → IP del VPS
#   2. sudo cp deploy/nginx/facturard-admin.conf /etc/nginx/sites-available/facturard-admin
#      (cambiar el puerto si WEB_PORT no es 3001; en el VPS actual es 8131)
#   3. sudo ln -s /etc/nginx/sites-available/facturard-admin /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d adminfacturard.dmaia.io

server {
    listen 80;
    listen [::]:80;
    server_name adminfacturard.dmaia.io;

    # X-Frame-Options y frame-ancestors los manda la app (next.config.ts) según el dominio.
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/facturard-proxy.conf;
    }
}
