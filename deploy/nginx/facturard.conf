# FacturaRD — sitios del nginx del host.
#   sudo cp deploy/nginx/facturard.conf /etc/nginx/sites-available/facturard.conf
#   sudo ln -s /etc/nginx/sites-available/facturard.conf /etc/nginx/sites-enabled/
#   (reemplazar app.facturard.do / api.facturard.do por APP_DOMAIN / API_DOMAIN del .env)
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.facturard.do -d api.facturard.do   ← agrega el bloque 443 y la redirección
# Los puertos 3000/3001 deben coincidir con API_PORT / WEB_PORT del deploy/.env.

# Frontend — se embebe en iframes de GoHighLevel. Las cabeceras de framing las pone Next
# (next.config.ts): NO agregar X-Frame-Options aquí ni en el nginx.conf global.
server {
    listen 80;
    listen [::]:80;
    server_name app.facturard.do;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

# API + receptor DGII (/fe/* fuera de /api/v1 — son las URLs que se registran en el portal DGII).
server {
    listen 80;
    listen [::]:80;
    server_name api.facturard.do;

    # P12 (onboarding / certificados), XML de la DGII, logos.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Envío en lote (5 PDFs + GHL) y emisión pueden tardar más que el default de 60s.
        proxy_read_timeout 120s;
    }
}

# Necesario para el header Connection de arriba (si otro sitio ya lo define, borrar este bloque).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
