# FacturaRD en UN solo dominio (APP_DOMAIN = API_DOMAIN en deploy/.env).
# Rutas de la API por prefijo; el resto va al frontend Next.js. setup.sh reemplaza
# app.facturard.do y los puertos; certbot añade el bloque 443 y la redirección.
#
# Usa $connection_upgrade: si el nginx del host no define ese `map`, setup.sh deja
# el bloque `map` del final; si ya existe (conf.d global), lo quita.

server {
    listen 80;
    listen [::]:80;
    server_name app.facturard.do;

    # P12 (onboarding / certificados), XML de la DGII, logos.
    client_max_body_size 20m;

    # API (JSON) — /api/v1/*
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/facturard-proxy.conf;
        # Envío en lote (5 PDFs + GHL) y emisión pueden tardar más que el default.
        proxy_read_timeout 120s;
    }

    # Receptor DGII (Paso 7) — fuera de /api/v1; son las URLs que se registran en el portal.
    location /fe/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/facturard-proxy.conf;
    }

    # Swagger
    location /docs {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/facturard-proxy.conf;
    }

    # Frontend — se embebe en iframes de GoHighLevel: Next manda las cabeceras de
    # framing; NO agregar X-Frame-Options aquí.
    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/facturard-proxy.conf;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
