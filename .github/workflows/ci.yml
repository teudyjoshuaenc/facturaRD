name: CI FacturaRD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./facturard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: facturard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @facturard/database generate

      - name: TypeScript check
        run: pnpm turbo run build --filter=@facturard/api

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Run tests (ecf-engine)
        run: pnpm --filter @facturard/ecf-engine test
        env:
          NODE_ENV: test
